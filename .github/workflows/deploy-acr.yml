name: Build and Push to ACR

# 只在 kiwiagent fork 上运行 —— 上游同名 workflow 无害地失败但不会占我们的时间
on:
  push:
    branches: [main, dev, 'release/**']
    # The image copies the whole repo (Dockerfile `COPY . .`), so any code
    # change needs a build; only skip what never reaches the image. (The old
    # allow-list missed tools/ and gateway/, so those merges never deployed.)
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "tests/**"
      - "tests-js/**"
      - ".plans/**"
      - "contributors/**"
      - "infographic/**"
      # Not "**/*.md": skills are SKILL.md files and do change the agent.
  workflow_dispatch:

env:
  ACR_REGISTRY:  crpi-pee5kv73ffvwtvva.cn-chengdu.personal.cr.aliyuncs.com
  ACR_NAMESPACE: smartbuddy

jobs:
  build:
    # 仅在 kiwiagent 组织下跑, 避免 upstream 同步时误触
    if: github.repository == 'kiwiagent/hermes-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # main → :latest + :main-<short>. Any other branch (dev) → :dev-<short>
      # only: a dev build must never move :latest, which is what a pod falls back
      # to when no digest is pinned. The branch is in the tag so the registry
      # listing says where an image came from. gitops pins SMARTBUDDY_AGENT_IMAGE
      # by digest, so a new tag deploys nothing by itself — bump the manifest.
      - name: Work out the image tags
        id: tags
        run: |
          image="$ACR_REGISTRY/$ACR_NAMESPACE/hermes-agent"
          short="${GITHUB_SHA::7}"
          {
            echo 'list<<TAGS'
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "${image}:latest"
              echo "${image}:main-${short}"
            else
              echo "${image}:dev-${short}"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push hermes-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Aliyun 个人版 ACR 不支持 OCI 1.1 的 attestation manifest
          # (application/vnd.oci.empty.v1+json) —— 新版 buildx 默认会生成它,
          # 导致 push 报 "unknown manifest class". 关掉 provenance/sbom, 产出
          # 传统单 manifest, ACR 才能接收.
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=hermes-agent
          cache-to: type=gha,mode=max,scope=hermes-agent
